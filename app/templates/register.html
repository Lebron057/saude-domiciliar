{% extends "base.html" %}
{% block title %}Cadastro — CuidaHome{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>📝 Criar Conta</h1>
        <p class="subtitle">Cadastre-se na rede CuidaHome para plantões e locação</p>

        {% if error %}
        <div class="alert alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label for="role">Tipo de Conta</label>
                <select id="role" name="role" class="form-select" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-secondary, #12122a); border: 1px solid var(--border-color, #27272a); border-radius: 8px; color: #f4f4f5; font-size: 0.92rem; outline: none; margin-top: 0.3rem;">
                    <option value="familiar_paciente" selected>🏠 Familiar / Paciente (Contratar plantões e locação)</option>
                    <option value="profissional_saude">🩺 Profissional de Saúde (Cuidador, técnico ou enfermeiro)</option>
                    <option value="fornecedor_equipamento">📦 Fornecedor (Locador de aparelhos ortopédicos)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Criar Conta</button>
        </form>

        <div class="auth-footer">
            Já tem conta? <a href="/login">Faça login</a>
        </div>
    </div>
</div>
{% endblock %}
