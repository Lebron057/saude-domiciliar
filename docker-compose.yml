version: "3.8"

services:
  migrator:
    image: lebron057/catalog-service:latest
    container_name: migrator-iago
    command: ["python", "-m", "db.migrate"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - internal-net
    restart: "no"

  catalog-service:
    image: lebron057/catalog-service:latest
    container_name: catalog-service-iago
    ports:
      - "${APP_PORT:-8210}:8000"
    environment:
      - APP_NAME=${APP_NAME:-CuidaHome}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://iago-lima-isw055.lapps.studio}
      - PLATFORM_FEE_PERCENT=${PLATFORM_FEE_PERCENT:-12}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8001}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL:-http://log-service:8002}
      # Storage S3 (MinIO)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-garage:9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-GK6b0ba94e9e2e8921e8b3b2a4}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-4b8f2c1d9e3a7b6f5c4d2e1a8b7f6e5d4c3b2a1f9e8d7c6b5a4f3e2d1c0b9a8f}
      - MINIO_BUCKET=${MINIO_BUCKET:-avatars}
      - S3_BUCKET_AVATARS=${S3_BUCKET_AVATARS:-avatars}
      - S3_BUCKET_EQUIPAMENTOS=${S3_BUCKET_EQUIPAMENTOS:-equipamentos}
      - S3_BUCKET_CREDENCIAIS=${S3_BUCKET_CREDENCIAIS:-credenciais}
      - S3_BUCKET_DOCUMENTOS=${S3_BUCKET_DOCUMENTOS:-documentos}
      # Stripe
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - auth-service
      - log-service
      - garage
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  auth-service:
    image: lebron057/auth-service:latest
    container_name: auth-service-iago
    command: ["uvicorn", "auth_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-noreply@cuidahome.com.br}
      - LOG_SERVICE_URL=${LOG_SERVICE_URL:-http://log-service:8002}
    depends_on:
      - log-service
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  log-service:
    image: lebron057/log-service:latest
    container_name: log-service-iago
    command: ["uvicorn", "log_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
    expose:
      - "8002"
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  garage:
    image: minio/minio:RELEASE.2023-09-07T02-12-19Z
    container_name: garage-iago
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-GK6b0ba94e9e2e8921e8b3b2a4}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-4b8f2c1d9e3a7b6f5c4d2e1a8b7f6e5d4c3b2a1f9e8d7c6b5a4f3e2d1c0b9a8f}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-iago
    expose:
      - "6379"
    networks:
      - internal-net
    restart: unless-stopped
    volumes:
      - redis-data:/data

networks:
  internal-net:
    driver: bridge

volumes:
  redis-data:
  minio-data:
