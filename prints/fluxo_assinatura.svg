<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-ass" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-stripe" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-db" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ca8a04"/>
    </marker>
    <marker id="arrow-dash2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="490" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Ciclo de Vida de Assinatura Recorrente: Stripe Billing &amp; Gestão de Quotas</text>
  <text x="490" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">Do Checkout ao Webhook com Idempotência, Liberação de Limite e Customer Portal</text>

  <!-- Cabeçalhos das Linhas de Vida -->
  <!-- 1. Cliente -->
  <rect x="30" y="70" width="130" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-ass)"/>
  <text x="95" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Cliente / Familiar</text>
  <text x="95" y="103" text-anchor="middle" font-size="9" fill="#64748b">Assinante CuidaHome</text>
  <line x1="95" y1="112" x2="95" y2="530" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 2. catalog-service -->
  <rect x="230" y="70" width="150" height="42" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow-ass)"/>
  <text x="305" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">catalog-service</text>
  <text x="305" y="103" text-anchor="middle" font-size="9" fill="#c2410c">Stripe SDK / Webhook API</text>
  <line x1="305" y1="112" x2="305" y2="530" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 3. Stripe Gateway -->
  <rect x="470" y="70" width="160" height="42" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow-ass)"/>
  <text x="550" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">Stripe Gateway (SaaS)</text>
  <text x="550" y="103" text-anchor="middle" font-size="9" fill="#4f46e5">Billing · Checkout · Portal</text>
  <line x1="550" y1="112" x2="550" y2="530" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 4. MariaDB -->
  <rect x="730" y="70" width="150" height="42" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow-ass)"/>
  <text x="805" y="89" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">MariaDB FATEC</text>
  <text x="805" y="103" text-anchor="middle" font-size="9" fill="#a16207">Tabelas: locacoes, assinaturas</text>
  <line x1="805" y1="112" x2="805" y2="530" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ETAPAS DO FLUXO -->
  <!-- 1. Cliente clica em Assinar -->
  <line x1="95" y1="140" x2="300" y2="140" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-stripe)"/>
  <rect x="110" y="122" width="170" height="18" rx="3" fill="#ffffff" stroke="#fed7aa"/>
  <text x="195" y="135" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#9a3412">1. POST /locacoes/assinar {equip_id}</text>

  <!-- 2. App cria Checkout Session na Stripe -->
  <line x1="305" y1="170" x2="545" y2="170" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-stripe)"/>
  <rect x="320" y="152" width="210" height="18" rx="3" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="425" y="165" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#3730a3">2. Session.create(mode="subscription")</text>

  <!-- 3. Redirecionamento e Pagamento 4242 -->
  <line x1="550" y1="205" x2="100" y2="205" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow-stripe)"/>
  <rect x="180" y="187" width="280" height="18" rx="3" fill="#ffffff" stroke="#818cf8"/>
  <text x="320" y="200" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#312e81">3. Checkout UI (Cartão de teste 4242... preenchido)</text>

  <!-- 4. Stripe dispara Webhook assinado -->
  <line x1="550" y1="245" x2="310" y2="245" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-stripe)"/>
  <rect x="330" y="227" width="200" height="18" rx="3" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="430" y="240" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#3730a3">4. Webhook: checkout.session.completed</text>

  <!-- 5. Validação HMAC + Idempotência no App -->
  <path d="M 305 265 L 340 265 L 340 295 L 310 295" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-stripe)"/>
  <rect x="345" y="270" width="220" height="24" rx="3" fill="#fff7ed" stroke="#fb923c"/>
  <text x="455" y="282" text-anchor="middle" font-size="8" font-weight="bold" fill="#9a3412">5. construct_event(payload, sig, SECRET)</text>
  <text x="455" y="292" text-anchor="middle" font-size="7.5" fill="#c2410c">Checa event_id no banco (Idempotência estrita)</text>

  <!-- 6. Atualização no MariaDB -->
  <line x1="305" y1="330" x2="800" y2="330" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow-db)"/>
  <rect x="420" y="312" width="270" height="18" rx="3" fill="#ffffff" stroke="#fde047"/>
  <text x="555" y="325" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#713f12">6. UPDATE locacoes SET status='ativa', stripe_sub_id</text>

  <!-- 7. Limite Liberado na API -->
  <path d="M 305 355 L 335 355 L 335 380 L 310 380" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-stripe)"/>
  <text x="345" y="372" font-size="8" font-weight="bold" fill="#15803d">7. Quota liberada na API (Cota de locação ampliada)</text>

  <!-- 8. Resposta Webhook 200 OK -->
  <line x1="305" y1="400" x2="545" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dash2)"/>
  <text x="425" y="395" text-anchor="middle" font-size="8" fill="#64748b">8. HTTP 200 OK (Confirmação à Stripe)</text>

  <!-- 9. Cancelamento via Customer Portal -->
  <line x1="95" y1="440" x2="300" y2="440" stroke="#b96f1f" stroke-width="2" marker-end="url(#arrow-stripe)"/>
  <rect x="110" y="422" width="180" height="18" rx="3" fill="#ffffff" stroke="#fed7aa"/>
  <text x="200" y="435" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b96f1f">9. POST /portal (Gerenciar Assinatura)</text>

  <!-- 10. Sessão do Portal -->
  <line x1="305" y1="465" x2="545" y2="465" stroke="#6366f1" stroke-width="1.8" marker-end="url(#arrow-stripe)"/>
  <text x="425" y="460" text-anchor="middle" font-size="8" fill="#312e81">10. billing_portal.Session.create()</text>

  <!-- 11. Webhook de Cancelamento -->
  <line x1="550" y1="495" x2="310" y2="495" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-stripe)"/>
  <rect x="330" y="478" width="200" height="18" rx="3" fill="#ffffff" stroke="#fca5a5"/>
  <text x="430" y="490" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#991b1b">11. customer.subscription.deleted</text>

  <!-- 12. Atualização final de status -->
  <line x1="305" y1="520" x2="800" y2="520" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow-db)"/>
  <text x="555" y="515" text-anchor="middle" font-size="8" fill="#854d0e">12. UPDATE locacoes SET status='cancelada' (Bloqueia novas quotas)</text>
</svg>
