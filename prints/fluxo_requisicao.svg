<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="950" height="560" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-seq" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-seq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b96f1f"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="475" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Fluxo Ponta a Ponta de uma Requisição: Contratação de Plantão de Cuidador</text>
  <text x="475" y="50" text-anchor="middle" font-size="11.5" fill="#6b7280">Ciclo Completo: Browser → FRP Proxy → catalog-service → auth-service → MariaDB → log-service</text>

  <!-- Cabeçalhos das Linhas de Vida -->
  <!-- 1. Cliente -->
  <rect x="30" y="75" width="130" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="95" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Cliente / Navegador</text>
  <text x="95" y="108" text-anchor="middle" font-size="9" fill="#64748b">familiar_paciente</text>
  <line x1="95" y1="117" x2="95" y2="520" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 2. FRP Proxy (GCP) -->
  <rect x="185" y="75" width="130" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="250" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">GCP Relay (FRP)</text>
  <text x="250" y="108" text-anchor="middle" font-size="9" fill="#2563eb">*.lapps.studio</text>
  <line x1="250" y1="117" x2="250" y2="520" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 3. catalog-service -->
  <rect x="340" y="75" width="140" height="42" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="410" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">catalog-service</text>
  <text x="410" y="108" text-anchor="middle" font-size="9" fill="#c2410c">Host Port: 8210</text>
  <line x1="410" y1="117" x2="410" y2="520" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 4. auth-service -->
  <rect x="505" y="75" width="130" height="42" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="570" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">auth-service</text>
  <text x="570" y="108" text-anchor="middle" font-size="9" fill="#15803d">RBAC / JWT :8001</text>
  <line x1="570" y1="117" x2="570" y2="520" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 5. MariaDB -->
  <rect x="660" y="75" width="130" height="42" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="725" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">MariaDB FATEC</text>
  <text x="725" y="108" text-anchor="middle" font-size="9" fill="#a16207">DB :3306</text>
  <line x1="725" y1="117" x2="725" y2="520" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 6. log-service & Redis -->
  <rect x="810" y="75" width="125" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-seq)"/>
  <text x="872" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">log-service / Redis</text>
  <text x="872" y="108" text-anchor="middle" font-size="9" fill="#0284c7">Streams :8002</text>
  <line x1="872" y1="117" x2="872" y2="520" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- PASSOS / MENSAGENS -->
  <!-- Passo 1: Browser -> FRP -->
  <line x1="95" y1="150" x2="245" y2="150" stroke="#b96f1f" stroke-width="2" marker-end="url(#arrow-seq)"/>
  <rect x="105" y="132" width="130" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="170" y="145" text-anchor="middle" font-size="9" font-weight="bold" fill="#b96f1f">1. HTTPS POST /plantoes</text>

  <!-- Passo 2: FRP -> App -->
  <line x1="250" y1="185" x2="405" y2="185" stroke="#b96f1f" stroke-width="2" marker-end="url(#arrow-seq)"/>
  <rect x="260" y="167" width="135" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="327" y="180" text-anchor="middle" font-size="9" font-weight="bold" fill="#b96f1f">2. TCP Bypass CGNAT :8210</text>

  <!-- Passo 3: App -> Auth -->
  <line x1="410" y1="225" x2="565" y2="225" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-seq)"/>
  <rect x="420" y="207" width="135" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="487" y="220" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">3. POST /auth/verify {JWT}</text>

  <!-- Passo 4: Auth -> MariaDB -->
  <line x1="570" y1="265" x2="720" y2="265" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow-seq)"/>
  <rect x="580" y="247" width="130" height="18" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="645" y="260" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#854d0e">4. SELECT role, ativo</text>

  <!-- Passo 5: MariaDB -> Auth -->
  <line x1="725" y1="295" x2="575" y2="295" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
  <text x="650" y="290" text-anchor="middle" font-size="8.5" fill="#64748b">5. role = 'familiar_paciente'</text>

  <!-- Passo 6: Auth -> App -->
  <line x1="570" y1="325" x2="415" y2="325" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
  <text x="490" y="320" text-anchor="middle" font-size="8.5" fill="#15803d">6. HTTP 200 {valido: true}</text>

  <!-- Passo 7: App -> MariaDB (INSERT com tenant) -->
  <line x1="410" y1="365" x2="720" y2="365" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow-seq)"/>
  <rect x="450" y="347" width="230" height="18" rx="3" fill="#ffffff" stroke="#fde047"/>
  <text x="565" y="360" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#713f12">7. INSERT INTO plantoes (cliente_id, paciente_id...)</text>

  <!-- Passo 8: MariaDB -> App -->
  <line x1="725" y1="395" x2="415" y2="395" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dash)"/>
  <text x="570" y="390" text-anchor="middle" font-size="8.5" fill="#64748b">8. OK (Plantão #142 Criado)</text>

  <!-- Passo 9: App -> Log -->
  <line x1="410" y1="430" x2="865" y2="430" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-seq)"/>
  <rect x="520" y="412" width="220" height="18" rx="3" fill="#ffffff" stroke="#bae6fd"/>
  <text x="630" y="425" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0369a1">9. POST /eventos {"tipo": "plantao.solicitado"}</text>

  <!-- Passo 10: Log processa stream -->
  <path d="M 872 445 L 905 445 L 905 465 L 877 465" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-seq)"/>
  <text x="915" y="458" font-size="8" fill="#991b1b">XADD evt:plantao</text>

  <!-- Passo 11: App -> Cliente (Resposta 201) -->
  <line x1="410" y1="495" x2="100" y2="495" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-seq)"/>
  <rect x="160" y="477" width="240" height="18" rx="3" fill="#ffffff" stroke="#86efac"/>
  <text x="280" y="490" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">10. HTTP 201 Created (Redirect /plantao/142)</text>
</svg>
