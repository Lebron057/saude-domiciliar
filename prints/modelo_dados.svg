<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-er" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Título -->
  <text x="500" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Modelo Relacional de Dados do Domínio — CuidaHome SaaS</text>
  <text x="500" y="46" text-anchor="middle" font-size="11.5" fill="#6b7280">Diagrama Entidade-Relacionamento: Usuários, Saúde, Plantões, Locações e Stripe</text>

  <!-- TABELA: usuarios -->
  <rect x="30" y="70" width="210" height="210" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-er)"/>
  <rect x="30" y="70" width="210" height="26" rx="6" fill="#3b82f6"/>
  <text x="135" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">usuarios</text>
  <text x="40" y="112" font-size="9.5" font-weight="bold" fill="#1e3a8a">PK  id : INT</text>
  <text x="40" y="128" font-size="9.5" fill="#334155">    nome : VARCHAR(120)</text>
  <text x="40" y="144" font-size="9.5" fill="#334155">    email : VARCHAR(150) (UQ)</text>
  <text x="40" y="160" font-size="9.5" fill="#334155">    senha_hash : VARCHAR(255)</text>
  <text x="40" y="176" font-size="9.5" font-weight="bold" fill="#b96f1f">    role : VARCHAR(32)</text>
  <text x="40" y="192" font-size="9.5" fill="#334155">    telefone : VARCHAR(20)</text>
  <text x="40" y="208" font-size="9.5" fill="#334155">    ativo : BOOLEAN</text>
  <text x="40" y="224" font-size="9.5" font-weight="bold" fill="#6366f1">    stripe_customer_id : VARCHAR(64)</text>
  <text x="40" y="240" font-size="9.5" fill="#334155">    stripe_subscription_id : VARCHAR(64)</text>
  <text x="40" y="256" font-size="9.5" fill="#334155">    plano_status : VARCHAR(20)</text>
  <text x="40" y="272" font-size="9" fill="#64748b">    criado_em : TIMESTAMP</text>

  <!-- TABELA: perfis_profissionais -->
  <rect x="270" y="70" width="210" height="155" rx="6" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow-er)"/>
  <rect x="270" y="70" width="210" height="26" rx="6" fill="#16a34a"/>
  <text x="375" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">perfis_profissionais</text>
  <text x="280" y="112" font-size="9.5" font-weight="bold" fill="#166534">PK,FK  usuario_id : INT</text>
  <text x="280" y="128" font-size="9.5" fill="#334155">       categoria : ENUM</text>
  <text x="280" y="144" font-size="9.5" fill="#334155">       registro_conselho : VARCHAR(50)</text>
  <text x="280" y="160" font-size="9.5" fill="#334155">       diaria_12h_centavos : INT</text>
  <text x="280" y="176" font-size="9.5" fill="#334155">       diaria_24h_centavos : INT</text>
  <text x="280" y="192" font-size="9.5" font-weight="bold" fill="#ca8a04">       status_verificacao : ENUM</text>
  <text x="280" y="208" font-size="9" fill="#64748b">       bio : TEXT</text>

  <!-- TABELA: credenciais -->
  <rect x="510" y="70" width="210" height="155" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow-er)"/>
  <rect x="510" y="70" width="210" height="26" rx="6" fill="#0d9488"/>
  <text x="615" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">credenciais (Docs S3)</text>
  <text x="520" y="112" font-size="9.5" font-weight="bold" fill="#115e59">PK  id : INT</text>
  <text x="520" y="128" font-size="9.5" font-weight="bold" fill="#0f766e">FK  usuario_id : INT</text>
  <text x="520" y="144" font-size="9.5" fill="#334155">    tipo_documento : VARCHAR(50)</text>
  <text x="520" y="160" font-size="9.5" fill="#334155">    bucket : VARCHAR(64)</text>
  <text x="520" y="176" font-size="9.5" fill="#334155">    object_key : VARCHAR(255)</text>
  <text x="520" y="192" font-size="9.5" fill="#334155">    aprovado : BOOLEAN</text>
  <text x="520" y="208" font-size="9" fill="#64748b">    enviado_em : TIMESTAMP</text>

  <!-- TABELA: pacientes -->
  <rect x="30" y="320" width="210" height="155" rx="6" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow-er)"/>
  <rect x="30" y="320" width="210" height="26" rx="6" fill="#8b5cf6"/>
  <text x="135" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">pacientes</text>
  <text x="40" y="362" font-size="9.5" font-weight="bold" fill="#5b21b6">PK  id : INT</text>
  <text x="40" y="378" font-size="9.5" font-weight="bold" fill="#6d28d9">FK  cliente_id : INT</text>
  <text x="40" y="394" font-size="9.5" fill="#334155">    nome : VARCHAR(120)</text>
  <text x="40" y="410" font-size="9.5" fill="#334155">    data_nascimento : DATE</text>
  <text x="40" y="426" font-size="9.5" fill="#334155">    diagnostico : TEXT</text>
  <text x="40" y="442" font-size="9.5" fill="#334155">    cidade : VARCHAR(80)</text>
  <text x="40" y="458" font-size="9" fill="#64748b">    criado_em : TIMESTAMP</text>

  <!-- TABELA: plantoes -->
  <rect x="270" y="260" width="210" height="225" rx="6" fill="#f8fafc" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow-er)"/>
  <rect x="270" y="260" width="210" height="26" rx="6" fill="#ea580c"/>
  <text x="375" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">plantoes</text>
  <text x="280" y="302" font-size="9.5" font-weight="bold" fill="#9a3412">PK  id : INT</text>
  <text x="280" y="318" font-size="9.5" font-weight="bold" fill="#c2410c">FK  paciente_id : INT</text>
  <text x="280" y="334" font-size="9.5" font-weight="bold" fill="#c2410c">FK  cliente_id : INT</text>
  <text x="280" y="350" font-size="9.5" fill="#334155">FK  profissional_id : INT (NULL)</text>
  <text x="280" y="366" font-size="9.5" fill="#334155">    tipo_escala : ENUM(12h, 24h)</text>
  <text x="280" y="382" font-size="9.5" fill="#334155">    data_inicio : DATETIME</text>
  <text x="280" y="398" font-size="9.5" font-weight="bold" fill="#ca8a04">    status : ENUM</text>
  <text x="280" y="414" font-size="9.5" fill="#334155">    valor_centavos : INT</text>
  <text x="280" y="430" font-size="9.5" fill="#334155">    taxa_centavos : INT (Take Rate)</text>
  <text x="280" y="446" font-size="9.5" fill="#334155">    valor_repasse_centavos : INT</text>
  <text x="280" y="462" font-size="9.5" fill="#334155">    stripe_payment_intent : VARCHAR(64)</text>
  <text x="280" y="478" font-size="9" fill="#64748b">    version : INT (Lock Otimista)</text>

  <!-- TABELA: equipamentos -->
  <rect x="510" y="260" width="210" height="175" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow-er)"/>
  <rect x="510" y="260" width="210" height="26" rx="6" fill="#0284c7"/>
  <text x="615" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">equipamentos</text>
  <text x="520" y="302" font-size="9.5" font-weight="bold" fill="#075985">PK  id : INT</text>
  <text x="520" y="318" font-size="9.5" font-weight="bold" fill="#0369a1">FK  fornecedor_id : INT</text>
  <text x="520" y="334" font-size="9.5" fill="#334155">    nome : VARCHAR(120)</text>
  <text x="520" y="350" font-size="9.5" fill="#334155">    categoria : VARCHAR(50)</text>
  <text x="520" y="366" font-size="9.5" fill="#334155">    diaria_centavos : INT</text>
  <text x="520" y="382" font-size="9.5" font-weight="bold" fill="#6366f1">    stripe_price_id : VARCHAR(64)</text>
  <text x="520" y="398" font-size="9.5" fill="#334155">    caucao_centavos : INT</text>
  <text x="520" y="414" font-size="9.5" fill="#334155">    disponivel : BOOLEAN</text>
  <text x="520" y="430" font-size="9" fill="#64748b">    imagem_url : VARCHAR(255)</text>

  <!-- TABELA: locacoes (Stripe Billing) -->
  <rect x="750" y="260" width="220" height="195" rx="6" fill="#f8fafc" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow-er)"/>
  <rect x="750" y="260" width="220" height="26" rx="6" fill="#6366f1"/>
  <text x="860" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">locacoes (Stripe Billing)</text>
  <text x="760" y="302" font-size="9.5" font-weight="bold" fill="#3730a3">PK  id : INT</text>
  <text x="760" y="318" font-size="9.5" font-weight="bold" fill="#4338ca">FK  equipamento_id : INT</text>
  <text x="760" y="334" font-size="9.5" font-weight="bold" fill="#4338ca">FK  cliente_id : INT</text>
  <text x="760" y="350" font-size="9.5" font-weight="bold" fill="#4f46e5">    stripe_subscription_id : VARCHAR(64)</text>
  <text x="760" y="366" font-size="9.5" fill="#334155">    stripe_customer_id : VARCHAR(64)</text>
  <text x="760" y="382" font-size="9.5" font-weight="bold" fill="#ca8a04">    status : ENUM (ativa, cancelada)</text>
  <text x="760" y="398" font-size="9.5" fill="#334155">    data_inicio : DATETIME</text>
  <text x="760" y="414" font-size="9.5" fill="#334155">    data_fim : DATETIME (NULL)</text>
  <text x="760" y="430" font-size="9.5" fill="#334155">    caucao_hold_id : VARCHAR(64)</text>
  <text x="760" y="446" font-size="9" fill="#64748b">    renovacoes_count : INT</text>

  <!-- TABELA: transacoes_ledger -->
  <rect x="510" y="465" width="460" height="135" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.5" filter="url(#shadow-er)"/>
  <rect x="510" y="465" width="460" height="26" rx="6" fill="#059669"/>
  <text x="740" y="483" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">transacoes_ledger (Split e Repasses Financeiros)</text>
  <text x="520" y="507" font-size="9.5" font-weight="bold" fill="#065f46">PK id : INT | FK beneficiario_id : INT | FK plantao_id : INT (NULL) | FK locacao_id : INT (NULL)</text>
  <text x="520" y="525" font-size="9.5" fill="#334155">tipo_transacao : ENUM(recebimento_cliente, taxa_plataforma, repasse_profissional, repasse_fornecedor)</text>
  <text x="520" y="543" font-size="9.5" fill="#334155">valor_bruto_centavos : INT  |  taxa_centavos : INT (12-15%)  |  valor_liquido_centavos : INT</text>
  <text x="520" y="561" font-size="9.5" font-weight="bold" fill="#059669">status_repasse : ENUM(pendente, transferido, retido)  |  data_compensacao : TIMESTAMP</text>

  <!-- RELACIONAMENTOS (Linhas Conectoras) -->
  <!-- usuarios -> perfis_profissionais -->
  <line x1="240" y1="120" x2="270" y2="120" stroke="#16a34a" stroke-width="1.5"/>
  <!-- usuarios -> credenciais -->
  <path d="M 240 100 L 510 100" fill="none" stroke="#0d9488" stroke-width="1.5"/>
  <!-- usuarios -> pacientes -->
  <line x1="135" y1="280" x2="135" y2="320" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- pacientes -> plantoes -->
  <line x1="240" y1="360" x2="270" y2="360" stroke="#ea580c" stroke-width="1.5"/>
  <!-- usuarios -> plantoes (cliente_id) -->
  <path d="M 240 180 L 255 180 L 255 330 L 270 330" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <!-- usuarios -> equipamentos (fornecedor_id) -->
  <path d="M 240 200 L 495 200 L 495 320 L 510 320" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <!-- equipamentos -> locacoes -->
  <line x1="720" y1="320" x2="750" y2="320" stroke="#6366f1" stroke-width="1.5"/>
  <!-- usuarios -> locacoes (cliente_id) -->
  <path d="M 240 220 L 735 220 L 735 340 L 750 340" fill="none" stroke="#6366f1" stroke-width="1.5"/>
</svg>
