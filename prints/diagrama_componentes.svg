<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b96f1f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Arquitetura de Microsserviços e Topologia de Rede — CuidaHome SaaS</text>
  <text x="500" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Segregação de Borda Pública (FRP / GCP) vs Rede Privada Docker (internal-net) no Portainer CE</text>

  <!-- ZONA PÚBLICA / WAN -->
  <rect x="30" y="75" width="240" height="490" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="45" y="85" width="210" height="26" rx="4" fill="#e2e8f0"/>
  <text x="150" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">BORDA PÚBLICA / WAN</text>

  <!-- Cliente / Navegador -->
  <rect x="50" y="130" width="200" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Clientes / Navegadores</text>
  <text x="150" y="178" text-anchor="middle" font-size="10.5" fill="#64748b">HTTPS: *.lapps.studio</text>
  <text x="150" y="195" text-anchor="middle" font-size="9.5" fill="#b96f1f">Familiar · Profissional · Admin</text>

  <!-- GCP Always Free Relay -->
  <rect x="50" y="240" width="200" height="95" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">GCP e2-micro (Always Free)</text>
  <text x="150" y="285" text-anchor="middle" font-size="10.5" fill="#2563eb">Relay FRP / IP: 35.226.64.52</text>
  <text x="150" y="303" text-anchor="middle" font-size="9.5" fill="#475569">Bypass de CGNAT On-Premises</text>
  <text x="150" y="320" text-anchor="middle" font-size="9" fill="#16a34a">Túnel TCP Criptografado</text>

  <!-- Stripe Gateway -->
  <rect x="50" y="365" width="200" height="95" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">Stripe Gateway (SaaS)</text>
  <text x="150" y="410" text-anchor="middle" font-size="10" fill="#4f46e5">Checkout &amp; Stripe Billing</text>
  <text x="150" y="428" text-anchor="middle" font-size="9" fill="#64748b">Cartão de teste 4242...</text>
  <text x="150" y="445" text-anchor="middle" font-size="9" fill="#059669">Webhooks Assinados HMAC</text>

  <!-- AMBIENTE ON-PREMISES / HOST PORTAINER -->
  <rect x="310" y="75" width="660" height="490" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <rect x="330" y="85" width="620" height="28" rx="6" fill="#f3e8ff"/>
  <text x="640" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">AMBIENTE ON-PREMISES (FATEC POMPEIA) · STACK PORTAINER (HOST PORT: 8210)</text>

  <!-- REDE DOCKER INTERNA (internal-net) -->
  <rect x="330" y="125" width="620" height="425" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="640" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">REDE DOCKER BRIDGE PRIVADA (internal-net)</text>

  <!-- catalog-service (Borda do Host) -->
  <rect x="350" y="165" width="260" height="115" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="173" width="100" height="18" rx="3" fill="#ea580c"/>
  <text x="410" y="186" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">PÚBLICO (8210)</text>
  <text x="480" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">catalog-service</text>
  <text x="480" y="224" text-anchor="middle" font-size="10" fill="#475569">FastAPI / SSR Jinja2 / Python 3.11</text>
  <text x="480" y="242" text-anchor="middle" font-size="9.5" fill="#64748b">Landing Page · Catálogo · Mural Plantões</text>
  <text x="480" y="260" text-anchor="middle" font-size="9" fill="#c2410c">Stripe Webhook Listener · S3 Streaming Proxy</text>

  <!-- auth-service -->
  <rect x="660" y="165" width="270" height="105" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="173" width="90" height="18" rx="3" fill="#16a34a"/>
  <text x="715" y="186" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">PRIVADO :8001</text>
  <text x="795" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">auth-service</text>
  <text x="795" y="224" text-anchor="middle" font-size="10" fill="#475569">FastAPI / PyJWT / bcrypt</text>
  <text x="795" y="242" text-anchor="middle" font-size="9" fill="#166534">Matriz RBAC (4 Papéis) · Validação Sessão</text>
  <text x="795" y="258" text-anchor="middle" font-size="8.5" fill="#64748b">Reset Senha (SMTP) · Padrão A Centralizado</text>

  <!-- log-service -->
  <rect x="350" y="315" width="260" height="100" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="360" y="323" width="90" height="18" rx="3" fill="#0284c7"/>
  <text x="405" y="336" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">PRIVADO :8002</text>
  <text x="480" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">log-service</text>
  <text x="480" y="374" text-anchor="middle" font-size="10" fill="#475569">FastAPI / redis-py / Telemetria</text>
  <text x="480" y="392" text-anchor="middle" font-size="9" fill="#0369a1">Trilha de Auditoria · Timelines</text>
  <text x="480" y="407" text-anchor="middle" font-size="8.5" fill="#64748b">Eventos: plantao.* · locacao.* · rbac.*</text>

  <!-- Redis -->
  <rect x="660" y="295" width="130" height="85" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="303" width="80" height="16" rx="3" fill="#dc2626"/>
  <text x="710" y="315" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#ffffff">PORTA :6379</text>
  <text x="725" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">redis:7-alpine</text>
  <text x="725" y="354" text-anchor="middle" font-size="9" fill="#475569">Streams (XADD)</text>
  <text x="725" y="369" text-anchor="middle" font-size="8.5" fill="#7f1d1d">Sorted Sets (ZADD)</text>

  <!-- MinIO S3 (garage) -->
  <rect x="800" y="295" width="130" height="85" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="810" y="303" width="80" height="16" rx="3" fill="#a855f7"/>
  <text x="850" y="315" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#ffffff">PORTA :9000</text>
  <text x="865" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">garage (MinIO)</text>
  <text x="865" y="354" text-anchor="middle" font-size="8.5" fill="#475569">S3 Storage (4 Buckets)</text>
  <text x="865" y="369" text-anchor="middle" font-size="8" fill="#581c87">avatars · credenciais</text>

  <!-- MariaDB Dedicado -->
  <rect x="470" y="445" width="370" height="85" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="480" y="453" width="130" height="16" rx="3" fill="#ca8a04"/>
  <text x="545" y="465" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#ffffff">PORTA :3306 (GERENCIADO)</text>
  <text x="655" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">MariaDB Server (Cluster FATEC 35.226.64.52)</text>
  <text x="655" y="500" text-anchor="middle" font-size="9.5" fill="#475569">Base Dedicada: IAC_2026_02_iago_lima</text>
  <text x="655" y="516" text-anchor="middle" font-size="8.5" fill="#854d0e">Tabelas: usuarios · plantoes · locacoes · ledger · migrations</text>

  <!-- CONEXÕES E SETAS -->
  <!-- Cliente -> GCP -->
  <line x1="150" y1="210" x2="150" y2="235" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- GCP -> catalog-service -->
  <path d="M 250 280 L 300 280 L 300 220 L 345 220" fill="none" stroke="#b96f1f" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Stripe -> catalog-service -->
  <path d="M 250 410 L 320 410 L 320 250 L 345 250" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <!-- catalog-service -> auth-service -->
  <line x1="610" y1="200" x2="655" y2="200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="193" text-anchor="middle" font-size="8" fill="#15803d">/verify</text>
  <!-- catalog-service -> log-service -->
  <line x1="480" y1="280" x2="480" y2="310" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- log-service -> Redis -->
  <line x1="610" y1="340" x2="655" y2="340" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- catalog-service -> MinIO -->
  <path d="M 610 240 L 865 240 L 865 290" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- auth-service -> MariaDB -->
  <path d="M 795 270 L 795 440" fill="none" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- catalog-service -> MariaDB -->
  <path d="M 520 280 L 520 440" fill="none" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>